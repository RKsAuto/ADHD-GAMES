name: Keep server awake

# Pings the deployed Render service so the free tier never spins down,
# and fails visibly if the server or its database connection is down.
#
# Setup (one time): in the GitHub repo go to
#   Settings -> Secrets and variables -> Actions -> Variables
# and add a repository variable named RENDER_URL with your deployed URL,
# e.g. https://adhd-cognitive-games.onrender.com

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/status
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::warning::RENDER_URL repository variable is not set — skipping ping. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 0
          fi
          # --max-time 90 tolerates a cold start; --retry covers transient blips
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 "$RENDER_URL/api/status"
          echo
          echo "Server is awake and database is connected."
