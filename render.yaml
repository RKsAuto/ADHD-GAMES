services:
  - type: web
    name: ADHD-Cognitive-Games
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: EXPORT_KEY
        sync: false
      # Minutes between keep-awake self-pings (Render sleeps free services
      # after ~15 min idle). RENDER_EXTERNAL_URL is injected automatically;
      # set SELF_PING_MINUTES=0 to switch the self-ping off.
      - key: SELF_PING_MINUTES
        value: "10"
      # Only keep the service warm during these UTC hours. 24/7 pinging uses
      # ~744 of a free plan's 750 monthly instance-hours, which leads to
      # suspension; 03-16 UTC is 08:30-22:29 IST. Clear it on a paid plan.
      - key: SELF_PING_WINDOW_UTC
        value: "03-16"
      - key: PYTHON_VERSION
        value: 3.11.0
